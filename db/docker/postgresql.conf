# Procurement Portal Postgres config (local-dev tuned).
# Production should use stock Postgres defaults + WAL archiving.

# Listen on all interfaces (Docker maps 55432 -> 5432).
listen_addresses = '*'
port = 5432

# Connections.
max_connections = 100

# Memory (small dev container — adjust for prod).
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB

# WAL / checkpoint — friendlier on a dev laptop.
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# Logging — useful for smoke tests / debugging.
logging_collector = on
log_destination = 'stderr'
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '

# Locale.
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Extensions we want available by default.
# (pgaudit requires installing the postgres-16-pgaudit package; omitted in
# the bare postgres:16 image. Enable in production via custom Dockerfile.)